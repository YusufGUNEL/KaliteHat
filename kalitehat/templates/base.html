<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block baslik %}KaliteHat{% endblock %} · KaliteHat</title>
<link rel="stylesheet" href="{{ url_for('static', filename='stil.css') }}">
</head>
<body>
{% set ep = request.endpoint %}
<header>
  <a class="logo" href="{{ url_for('web.pano') }}">Kalite<span>Hat</span></a>
  <nav>
    <a href="{{ url_for('web.pano') }}" class="{{ 'aktif' if ep == 'web.pano' }}">Pano</a>
    <a href="{{ url_for('web.is_emirleri') }}" class="{{ 'aktif' if ep in ('web.is_emirleri','web.is_emri','web.muayene') }}">İş emirleri</a>
    <a href="{{ url_for('web.uygunsuzluklar') }}" class="{{ 'aktif' if ep in ('web.uygunsuzluklar','web.uygunsuzluk') }}">Uygunsuzluk / DÖF</a>
    <a href="{{ url_for('web.parcalar') }}" class="{{ 'aktif' if ep == 'web.parcalar' }}">Kontrol planları</a>
    <a href="{{ url_for('web.aletler') }}" class="{{ 'aktif' if ep == 'web.aletler' }}">Ölçüm aletleri</a>
    <a href="{{ url_for('web.izlenebilirlik') }}" class="{{ 'aktif' if ep == 'web.izlenebilirlik' }}">İzlenebilirlik</a>
  </nav>
</header>
<main>
  {% for kat, mesaj in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ kat }}">{{ mesaj }}</div>
  {% endfor %}
  {% block icerik %}{% endblock %}
</main>
{% block js %}{% endblock %}
</body>
</html>
